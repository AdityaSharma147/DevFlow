version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/devflow"
      JWT_SECRET: "docker-compose-jwt-secret"
      GROQ_API_KEY: ${GROQ_API_KEY}
      PORT: 5000
      FRONTEND_URL: "http://localhost:8080"
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./client/my-app
      args:
        VITE_API_URL: "http://localhost:5000/api"
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
